<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog — Sakib Khan</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: header('Sakib Khan')}"></div>

<main class="container">
    <h1>Blog</h1>

    <p th:if="${#lists.isEmpty(posts)}">No posts yet.</p>

    <div class="timeline-item" th:each="post : ${posts}">
        <h3><a th:href="@{'/blog/' + ${post.slug}}" th:text="${post.title}">Title</a></h3>
        <p class="meta" th:text="${#temporals.format(post.publishedAt, 'MMMM d, yyyy')}">Date</p>
        <p th:text="${post.summary}">Summary</p>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--/* What a crawler or link preview reads instead of the page body: the
         summary shown under the title in search results, the one address the
         page should be indexed under, and the card a pasted link expands to. */-->
    <th:block th:fragment="seo(title, description, path)">
        <meta name="description" th:content="${description}">
        <meta name="author" content="Sakib Khan">
        <link rel="canonical" th:href="${siteUrl + path}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Sakib Khan">
        <meta property="og:title" th:content="${title}">
        <meta property="og:description" th:content="${description}">
        <meta property="og:url" th:content="${siteUrl + path}">
        <meta name="twitter:card" content="summary">
    </th:block>
</head>
<body>

<header class="site-header" th:fragment="header(name)">
    <div class="container">
        <a href="/"><strong th:text="${name}">Portfolio</strong></a>
        <nav class="site-nav">
            <a href="/">Home</a>
            <a href="/blog">Blog</a>
            <a href="/resume">Résumé</a>
            <a href="/#contact">Contact</a>
            <a sec:authorize="isAuthenticated()" href="/admin">Admin</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container">
        &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Sakib Khan
    </div>
</footer>

</body>
</html>

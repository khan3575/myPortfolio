<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${post.id == null ? 'New post' : 'Edit post'}">Post</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: header('Sakib Khan')}"></div>

<main class="container">
    <h1 th:text="${post.id == null ? 'New post' : 'Edit post'}">Post</h1>

    <p class="error-text" th:if="${error}" th:text="${error}">Error</p>

    <form class="stacked" th:action="@{${formAction}}" th:object="${post}" method="post">
        <label>
            Title
            <input type="text" th:field="*{title}">
        </label>
        <label>
            Slug
            <input type="text" th:field="*{slug}" placeholder="auto-generated from title if left blank">
        </label>
        <label>
            Summary
            <input type="text" th:field="*{summary}" maxlength="500">
        </label>
        <label>
            Insert image
            <input type="file" id="imageUpload" accept="image/*">
        </label>
        <p id="imageUploadStatus"></p>

        <label>
            Content (Markdown)
            <textarea th:field="*{contentMarkdown}" id="contentMarkdown"></textarea>
        </label>
        <button type="submit">Save</button>
    </form>

    <p><a href="/admin">&larr; Back to posts</a></p>
</main>

<div th:replace="~{layout :: footer}"></div>

<script th:inline="none">
    document.getElementById('imageUpload').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (!file) {
            return;
        }
        const status = document.getElementById('imageUploadStatus');
        const csrfToken = document.querySelector('input[name="_csrf"]').value;
        status.textContent = 'Uploading...';

        const formData = new FormData();
        formData.append('image', file);
        formData.append('_csrf', csrfToken);

        fetch('/admin/images/upload', { method: 'POST', body: formData })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    status.textContent = data.error || 'Upload failed.';
                    return;
                }
                const textarea = document.getElementById('contentMarkdown');
                const cursorPos = textarea.selectionStart;
                const before = textarea.value.substring(0, cursorPos);
                const after = textarea.value.substring(cursorPos);
                const snippet = '![](' + data.url + ')';
                textarea.value = before + snippet + after;
                status.textContent = 'Image inserted.';
                event.target.value = '';
            })
            .catch(() => {
                status.textContent = 'Upload failed.';
            });
    });
</script>

</body>
</html>
